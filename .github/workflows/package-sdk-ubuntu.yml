name: Package SDK (Ubuntu)

on:
  push:
    branches:
      - ci/*
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libtool \
            gcc \
            g++ \
            autoconf \
            automake \
            cmake \
            libboost-all-dev \
            libsqlite3-dev \
            libssl-dev \
            libevent-dev \
            libmysqlclient-dev \
            redis \
            libnghttp2-dev \
            git \
            wget \
            unzip \
            zip

      - name: Fetch prebuilt deps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 deps.py sync
          echo "$PWD/deps/bin" >> "${GITHUB_PATH}"

      - name: Set version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="latest"
          fi
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"

      - name: Detect architecture
        id: arch
        run: echo "arch=$(dpkg --print-architecture)" >> "${GITHUB_OUTPUT}"

      - name: Build SDK
        run: |
          make sdk version="${{ steps.version.outputs.version }}"
          mv "chen-sdk-${{ steps.version.outputs.version }}.zip" \
             "chen-sdk-${{ steps.version.outputs.version }}-${{ steps.arch.outputs.arch }}.zip"

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chen-sdk-${{ steps.version.outputs.version }}-${{ steps.arch.outputs.arch }}
          path: chen-sdk-*.zip

  release:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download SDK artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Extract changelog for this version
        id: changelog
        run: |
          VER="${{ steps.version.outputs.version }}"
          awk -v ver="## v${VER}" '
            $0 ~ ver { found=1; next }
            found && /^## v/ { exit }
            found
          ' CHANGELOG.md > /tmp/release_body.md
          if [ ! -s /tmp/release_body.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > /tmp/release_body.md
          fi
          # 用 cat 输出，避免 echo 把反引号解释为命令替换
          {
            echo "body<<EOF"
            cat /tmp/release_body.md
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release_body.md \
            ./artifacts/chen-sdk-*.zip
