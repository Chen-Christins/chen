#           weight: 100
#
# # Rock 客户端负载均衡策略（配合 RockSDLoadBalance 手动启动）
# rock_services:
#   astartes:
#     rock: round_robin
#
# rock:
#   service_worker: ""       # 建连 worker 调度器名，留空用当前调度器
#   request_max_retry: 2     # 无响应时换实例重试次数
#
# # 被动健康检查：连续失败后摘除实例
# load_balance:
#   fail_threshold: 3
#   fail_cooldown_ms: 5000


# 服务器配置
server:
  work_path: /home/chen/workspace/chen/
  pid_file: blog.pid
  # 多进程热重载（master/worker）相关参数（均可选，以下为默认值）
  # drain_timeout_ms: 3000            # 旧 worker 停止 accept 后等待遗留连接的毫秒数，超时强制关闭
  # worker_ready_timeout_ms: 30000    # master 等待新 worker 就绪的超时毫秒数
  # worker_restart_interval_ms: 2000  # worker 崩溃后 master 重启前的等待毫秒数
  # housekeeping_interval_ms: 500     # worker 检查关闭信号的定时器间隔

workers:
  # HTTP服务器IO线程
  io:
    thread_num: 2
  # HTTP服务器accept线程
  accept:
    thread_num: 1
