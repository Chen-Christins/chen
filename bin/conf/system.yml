# 系统配置文件
servers:
  # HTTP服务器 - 用于客户端连接
  - address: ["0.0.0.0:8090"]
    keepalive: 1
    timeout: 1000
    name: game_http_server
    accept_worker: accept
    io_worker: io
    process_worker: io
    type: http
    negotiateH2: 1
    # 连接级限流（可选，全部缺省则不启用）
    # args:
    #   accept_qps: 1000      # 每秒最多接受的新连接数
    #   accept_burst: 2000    # 瞬时突发上限（缺省 = accept_qps）
    #   max_conn: 10000       # 最大并发连接数

  # # RPC服务器 - 用于服务器间通讯
  # - address: ["0.0.0.0:9090"]
  #   timeout: 30000
  #   name: game_rpc_server
  #   accept_worker: accept
  #   io_worker: io
  #   process_worker: io
  #   type: rpc

  # # Game 协议服务器 - 长度头格式 [magic][cmd][seq][len]
  # - address: ["0.0.0.0:9001"]
  #   timeout: 30000
  #   name: game_protocol_server
  #   accept_worker: accept
  #   io_worker: io
  #   process_worker: io
  #   type: game


# 服务器配置
server:
  work_path: /home/chen/workspace/chen/
  pid_file: blog.pid
  # 多进程热重载（master/worker）相关参数（均可选，以下为默认值）
  # drain_timeout_ms: 3000            # 旧 worker 停止 accept 后等待遗留连接的毫秒数，超时强制关闭
  # worker_ready_timeout_ms: 30000    # master 等待新 worker 就绪的超时毫秒数
  # worker_restart_interval_ms: 2000  # worker 崩溃后 master 重启前的等待毫秒数
  # housekeeping_interval_ms: 500     # worker 检查关闭信号的定时器间隔

workers:
  # HTTP服务器IO线程
  io:
    thread_num: 2
  # HTTP服务器accept线程
  accept:
    thread_num: 1
