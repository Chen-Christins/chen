# 系统配置文件
servers:
  # HTTP服务器 - 用于客户端连接
  - address: ["0.0.0.0:8090"]
    keepalive: 1
    timeout: 1000
    name: game_http_server
    accept_worker: accept
    io_worker: io
    process_worker: io
    type: http
    negotiateH2: 1
    # 连接级限流（可选，全部缺省则不启用）
    # args:
    #   accept_qps: 1000      # 每秒最多接受的新连接数
    #   accept_burst: 2000    # 瞬时突发上限（缺省 = accept_qps）
    #   max_conn: 10000       # 最大并发连接数

  # # RPC服务器 - 用于服务器间通讯
  # - address: ["0.0.0.0:9090"]
  #   timeout: 30000
  #   name: game_rpc_server
  #   accept_worker: accept
  #   io_worker: io
  #   process_worker: io
  #   type: rpc

  # # Game 协议服务器 - 长度头格式 [magic][cmd][seq][len]
  # - address: ["0.0.0.0:9001"]
  #   timeout: 30000
  #   name: game_protocol_server
  #   accept_worker: accept
  #   io_worker: io
  #   process_worker: io
  #   type: game

  # # Rock 协议服务器 - 自定义二进制 RPC，模块通过 RockModule 处理请求
  # - address: ["0.0.0.0:9000"]
  #   timeout: 30000
  #   name: rock_server
  #   accept_worker: accept
  #   io_worker: io
  #   process_worker: io
  #   type: rock


# # 静态服务发现（可选）：配置后框架会自动创建 StaticServiceDiscovery
# service_discovery:
