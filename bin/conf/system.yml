# 系统配置文件
servers:
  # HTTP服务器 - 用于客户端连接
  - address: ["0.0.0.0:8090"]
    keepalive: 1
    timeout: 1000
    name: game_http_server
    accept_worker: accept
    io_worker: io
    process_worker: io
    type: http
    negotiateH2: 1
    # 连接级限流（可选，全部缺省则不启用）
    # args:
    #   accept_qps: 1000      # 每秒最多接受的新连接数
    #   accept_burst: 2000    # 瞬时突发上限（缺省 = accept_qps）
    #   max_conn: 10000       # 最大并发连接数

  # # RPC服务器 - 用于服务器间通讯
  # - address: ["0.0.0.0:9090"]
  #   timeout: 30000
  #   name: game_rpc_server
  #   accept_worker: accept
  #   io_worker: io
  #   process_worker: io
  #   type: rpc

  # # Game 协议服务器 - 长度头格式 [magic][cmd][seq][len]
  # - address: ["0.0.0.0:9001"]
  #   timeout: 30000
  #   name: game_protocol_server
  #   accept_worker: accept
  #   io_worker: io
  #   process_worker: io
  #   type: game


# 服务器配置
server:
  work_path: /home/chen/workspace/chen/
  pid_file: blog.pid

# 日志配置
logs:
  - name: root
    level: info
    formatter: "%d{%Y-%m-%d %H:%M:%S.%f}%T%t%T%N%T%F%T[%p]%T[%c]%T%f:%l%T%m%n"
    appenders:
      - type: FileLogAppender
        file: /home/chen/workspace/chen/logs/root.log
        # time_rotate: hour
        # max_size: 104857600   # 单文件超过 100MB 即分片
      - type: StdoutLogAppender
  - name: system
    level: debug
    formatter: "%d{%Y-%m-%d %H:%M:%S.%f}%T%t%T%N%T%F%T[%p]%T[%c]%T%f:%l%T%m%n"
    appenders:
      - type: FileLogAppender
        file: /home/chen/workspace/chen/logs/system.log
        # time_rotate: 30min
      - type: StdoutLogAppender
  - name: access
    level: info
    formatter: "%d{%Y-%m-%d %H:%M:%S.%f}%T%t%T%N%T%F%T[%p]%T[%c]%T%f:%l%T%m%n"
    appenders:
      - type: FileLogAppender
        file: /home/chen/workspace/chen/logs/access.log
        # time_rotate: day
        # max_size: 104857600   # 单文件超过 100MB 即分片
      - type: StdoutLogAppender
  - name: http_gateway
    level: debug
    formatter: "%d{%Y-%m-%d %H:%M:%S.%f}%T%t%T%N%T%F%T[%p]%T[%c]%T%f:%l%T%m%n"
    appenders:
      - type: FileLogAppender
        file: /home/chen/workspace/chen/logs/http_gateway.log
        # time_rotate: day
      - type: StdoutLogAppender


# 数据库配置
sqlite3:
  dbs:
    blog:
      path: /home/chen/workspace/chen/blog.db
      sql: PRAGMA synchronous = OFF


# Redis配置（由业务 module 决定是否使用，框架不主动初始化）
redis:
  config:
    blog:
      host: 127.0.0.1:6379
      type: fox_redis
      pool: 1
      timeout: 100
  desc: "type: redis,redis_cluster,fox_redis,fox_redis_cluster"


# Redis线程配置
fox_thread:
  redis:
    name: redis
    num: 1
    advance: 0


workers:
  # HTTP服务器IO线程
  io:
    thread_num: 2
  # HTTP服务器accept线程
  accept:
    thread_num: 1
